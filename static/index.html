<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basilisk仿真后处理软件v1.0</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><strong>BSPV</strong><span>Basilisk仿真后处理软件</span></div><label>结果目录 <input id="path" placeholder="输入算例目录" spellcheck="false"></label><button id="open">打开项目</button><label class="upload">上传日志 <input id="logFile" type="file"></label><button id="upload">上传并打开</button><label class="upload">上传轮廓 <input id="facetFile" type="file" accept=".dat" multiple></label><button id="uploadFacet">导入轮廓</button><span id="status"></span></header>
<main><aside><h2 id="projectName">当前工况</h2><p id="summary">请上传日志或打开结果目录</p><section><h3>历史工况</h3><div id="history" class="history"></div></section><label class="field">曲线变量<select id="variable"></select></label><section><h3>列名设置</h3><div id="columns" class="columns"></div></section><button id="downloadCsv" class="secondary">导出当前曲线 CSV</button><section><h3>数据源</h3><p id="sources"></p></section><section><h3>v1.0版本</h3><p>已支持日志曲线、PLIC 轮廓与时间轴联动。</p></section></aside>
<section class="workspace"><div class="cards"><article><div class="chartHead"><h2 id="curveTitle">当前曲线</h2><span id="curveInfo" class="coord">x = —，y = —</span><button id="saveCurve" class="icon">导出 PNG</button></div><canvas id="chart"></canvas><p class="hint">横轴为时间，虚线为当前时刻。</p></article><article><div class="chartHead"><h2>液滴轮廓</h2><button id="saveFacet" class="icon">导出 PNG</button></div><canvas id="facet"></canvas><p id="facetInfo" class="hint">轮廓帧：—</p></article></div><div class="timeline"><button id="play">▶ 播放</button><input id="time" type="range" min="0" max="1" step="0.01" value="0"><output id="timeOut">t = 0</output></div></section></main><script src="app.js?v=8"></script></body></html>
